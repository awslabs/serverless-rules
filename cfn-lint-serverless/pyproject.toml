[project]
name = "cfn_lint_serverless"
version = "0.3.6"
description = "Serverless rules for cfn-lint"
authors = [{name = "Amazon Web Service"}]
readme = "README.md"
license = "MIT-0"
requires-python = ">=3.10,<3.15"
dependencies = [
    "cfn-lint>=1.57.0,<2"
]

[dependency-groups]
dev = [
    "bandit>=1.9.4",
    "coverage>=7.16.2",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "radon>=6.0.1",
    "ruff>=0.17.0",
    "xenon>=0.9.3",
]

[build-system]
requires = ["hatchling>=1.32.4"]
build-backend = "hatchling.build"
