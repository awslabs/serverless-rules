AWSTemplateFormatVersion: "2010-09-09"

Resources:
  ApiGatewayRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          Effect: Allow
          Principal:
            Service: apigateway.amazonaws.com
          Action: sts:AssumeRole
      Policies:
        - PolicyName: PushLogs
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              Effect: Allow
              Action: "logs:*"
              Resource: "*"

  PipesRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          Effect: Allow
          Principal:
            Service: pipes.amazonaws.com
          Action: sts:AssumeRole
