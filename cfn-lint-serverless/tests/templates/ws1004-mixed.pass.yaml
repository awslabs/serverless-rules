AWSTemplateFormatVersion: "2010-09-09"
Transform: "AWS::Serverless-2016-10-31"

Resources:
  NativeFunction:
    Type: AWS::Lambda::Function
    Properties:
      Code:
        ZipFile: "def handler(event, context): return"
      Runtime: python3.12
      Handler: index.handler
      Role: arn:aws:iam::123456789012:role/my-role
      TracingConfig:
        Mode: Active

  SamFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Runtime: python3.12
      Handler: main.handler
      Tracing: Active

  NativeLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${NativeFunction}"
      RetentionInDays: 7

  SamLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${SamFunction}"
      RetentionInDays: 7
