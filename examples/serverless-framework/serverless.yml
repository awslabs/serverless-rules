service: aws-python-rest-api-project

frameworkVersion: '4'

provider:
  name: aws
  runtime: python3.13
  lambdaHashingVersion: '20201221'
  logRetentionInDays: 14
  tracing:
    lambda: true
    
functions:
  hello:
    handler: handler.hello
    events:
      - http:
          path: /
          method: get
